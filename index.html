<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1F3A">
<meta name="description" content="Mata kuliah Teknologi Keolahragaan — Ilmu Keolahragaan, Universitas Negeri Medan">
<title>Teknologi Keolahragaan</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="ikon-192.png">
<link rel="apple-touch-icon" href="ikon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
/* warna */
--navy:#0B1F3A; --navy-2:#13304F; --navy-3:#1D4370;
--kertas:#F6F7F9; --kartu:#FFFFFF;
--garis:#E4E8ED; --garis-2:#CBD3DC;
--teks:#0F1E2E; --teks-2:#5A6B7D; --teks-3:#93A1B0;
--api:#FF6B2C; --api-lembut:#FFF1E9;
--laut:#0F8B8D; --laut-lembut:#E4F3F3;
--hijau:#1F9254; --hijau-lembut:#E6F4EC;
--merah:#C9312B; --merah-lembut:#FBEAE9;
--kuning:#B47500; --kuning-lembut:#FFF4DE;
--aksen:var(--navy);
/* bentuk */
--r-s:10px; --r:14px; --r-l:20px;
--bayang:0 1px 2px rgba(15,30,46,.05), 0 4px 14px rgba(15,30,46,.05);
--bayang-t:0 2px 6px rgba(15,30,46,.07), 0 12px 32px rgba(15,30,46,.09);
/* huruf */
--f-judul:'Sora',system-ui,sans-serif;
--f-teks:'Plus Jakarta Sans',system-ui,sans-serif;
--f-mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--kertas);color:var(--teks);font-family:var(--f-teks);
font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit}
input,textarea,select{width:100%;padding:12px 14px;border:1.5px solid var(--garis-2);
border-radius:var(--r-s);background:var(--kartu);outline:none;font-family:inherit;
font-size:15px;color:var(--teks);transition:border-color .15s,box-shadow .15s}
input::placeholder,textarea::placeholder{color:var(--teks-3)}
input:focus,textarea:focus{border-color:var(--navy);box-shadow:0 0 0 3.5px rgba(11,31,58,.09)}
textarea{resize:vertical;min-height:104px;line-height:1.6}
h1,h2,h3{font-family:var(--f-judul);font-weight:600;letter-spacing:-.03em;margin:0;color:var(--teks)}
h1{font-size:30px;line-height:1.12}
h2{font-size:20px;line-height:1.22}
h3{font-size:16px;letter-spacing:-.02em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.app{max-width:460px;margin:0 auto;min-height:100vh;background:var(--kertas);padding-bottom:92px}
.pad{padding:20px 20px 28px}
.kepala{position:sticky;top:0;z-index:30;background:rgba(246,247,249,.88);
backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
border-bottom:1px solid var(--garis);padding:13px 16px;display:flex;align-items:center;
gap:11px;min-height:58px}
.kepala .judul{font-family:var(--f-judul);font-weight:600;font-size:15.5px;flex:1;
min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.02em}
.ib{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;
justify-content:center;font-size:17px;flex-shrink:0;border:1px solid transparent;color:var(--teks-2)}
.ib:hover{background:var(--kartu);border-color:var(--garis);color:var(--teks)}

.tbl{display:inline-flex;align-items:center;justify-content:center;gap:8px;
padding:13px 18px;border-radius:var(--r-s);background:var(--kartu);
border:1.5px solid var(--garis-2);font-weight:600;font-size:14.5px;
letter-spacing:-.01em;transition:transform .1s,box-shadow .15s,background .15s}
.tbl:active{transform:scale(.98)}
.tbl.utama{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:var(--bayang)}
.tbl.utama:hover{background:var(--navy-3)}
.tbl.api{background:var(--api);color:#fff;border-color:var(--api)}
.tbl.penuh{width:100%}
.tbl.kecil{padding:7px 13px;font-size:13px;border-radius:9px}
.tbl:disabled{opacity:.42;cursor:default}

.kartu{background:var(--kartu);border:1px solid var(--garis);border-radius:var(--r);
padding:17px;box-shadow:var(--bayang)}
.label{font-size:11px;font-family:var(--f-mono);letter-spacing:.1em;
text-transform:uppercase;color:var(--teks-3);font-weight:600}
.redup{color:var(--teks-2);font-size:13.5px}
.lencana{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;
font-family:var(--f-mono);font-weight:600;padding:4px 9px;border-radius:7px;
background:var(--kertas);color:var(--teks-2);letter-spacing:.02em}
.baris{display:flex;align-items:center;gap:12px}
.isi{flex:1;min-width:0}
.tumpuk{display:flex;flex-direction:column;gap:13px}
.sembunyi{display:none!important}

/* denyut pembuka */
.denyut{display:block;width:100%;height:30px}
.denyut path{fill:none;stroke:var(--api);stroke-width:2;stroke-linecap:round;
stroke-linejoin:round;stroke-dasharray:600;stroke-dashoffset:600;
animation:garis 2.2s .15s cubic-bezier(.4,0,.2,1) forwards}
@keyframes garis{to{stroke-dashoffset:0}}

/* daftar materi */
.mkartu{width:100%;text-align:left;background:var(--kartu);border:1px solid var(--garis);
border-radius:var(--r);padding:15px 16px;display:flex;align-items:center;gap:14px;
margin-bottom:10px;box-shadow:var(--bayang);transition:transform .1s,box-shadow .15s}
.mkartu:active{transform:scale(.99)}
.mkartu.kunci{background:transparent;box-shadow:none;border-style:dashed;opacity:.62}
.mkartu.jalan{border-color:var(--navy);border-width:1.5px;box-shadow:var(--bayang-t)}
.nomor{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;
justify-content:center;font-family:var(--f-mono);font-size:14px;font-weight:600;
flex-shrink:0;background:var(--kertas);color:var(--teks-3)}
.mkartu.selesai .nomor{background:var(--hijau-lembut);color:var(--hijau)}
.mkartu.jalan .nomor{background:var(--navy);color:#fff}
.mkartu h3{font-size:15px;font-weight:600;font-family:var(--f-teks);letter-spacing:-.015em}

/* bilah kemajuan */
.bilah{height:7px;background:var(--garis);border-radius:99px;overflow:hidden}
.bilah i{display:block;height:100%;background:var(--api);border-radius:99px;transition:width .6s cubic-bezier(.4,0,.2,1)}

/* tab bawah */
.tab{position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(255,255,255,.92);
backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
border-top:1px solid var(--garis);display:flex;padding:8px 8px 14px;
max-width:460px;margin:0 auto}
.tab button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
padding:7px 0;font-size:11px;color:var(--teks-3);font-weight:600;border-radius:12px;
letter-spacing:-.01em}
.tab button i{font-size:19px;font-style:normal;line-height:1}
.tab button.aktif{color:var(--navy);background:var(--kertas)}

/* bagian materi */
.sesi{margin-bottom:26px}
.sesi>.label{display:block;margin-bottom:11px}
.langkah{display:flex;align-items:flex-start;gap:13px;padding:14px 16px;
background:var(--kartu);border:1px solid var(--garis);border-radius:var(--r);
margin-bottom:9px;width:100%;text-align:left;box-shadow:var(--bayang)}
.langkah .tanda{width:26px;height:26px;border-radius:99px;display:flex;
align-items:center;justify-content:center;font-size:13px;flex-shrink:0;
background:var(--kertas);color:var(--teks-3);border:1.5px solid var(--garis-2);margin-top:1px}
.langkah.beres .tanda{background:var(--hijau);color:#fff;border-color:var(--hijau)}
.langkah .nama{font-weight:600;font-size:14.5px;display:block}
.langkah .ket{font-size:12.5px;color:var(--teks-2);display:block;margin-top:1px}

/* skala pemahaman */
.skala{display:flex;gap:8px}
.skala button{flex:1;padding:14px 4px;border-radius:var(--r-s);border:1.5px solid var(--garis-2);
background:var(--kartu);display:flex;flex-direction:column;align-items:center;gap:4px;
font-size:11px;color:var(--teks-2);font-weight:600;transition:all .15s}
.skala button b{font-family:var(--f-mono);font-size:17px;color:var(--teks)}
.skala button.pilih{border-color:var(--navy);background:var(--navy);color:#fff}
.skala button.pilih b{color:#fff}

.centang{display:flex;align-items:center;gap:12px;padding:13px 15px;
border:1.5px solid var(--garis-2);border-radius:var(--r-s);background:var(--kartu);
width:100%;text-align:left;font-size:14.5px;font-weight:500;margin-bottom:9px}
.centang .kotak{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--garis-2);
display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;color:transparent}
.centang.pilih{border-color:var(--navy)}
.centang.pilih .kotak{background:var(--navy);border-color:var(--navy);color:#fff}

.layar{background:var(--navy);border-radius:var(--r);overflow:hidden;position:relative;
box-shadow:var(--bayang-t)}
.angka{font-family:var(--f-mono);font-size:38px;font-weight:600;letter-spacing:-.03em;line-height:1}
.petak{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:9px}
.petak>div{background:var(--kertas);border-radius:var(--r-s);padding:11px 13px}
.petak b{display:block;font-family:var(--f-mono);font-size:18px;font-weight:600}
.petak span{font-size:11.5px;color:var(--teks-2)}

.catatan{background:var(--kuning-lembut);border-radius:var(--r-s);padding:13px 15px;
font-size:13.5px;color:#7A5200;line-height:1.55}
.sukses{background:var(--hijau-lembut);border-radius:var(--r-s);padding:13px 15px;
font-size:13.5px;color:#14663A}
.galat{background:var(--merah-lembut);border-radius:var(--r-s);padding:13px 15px;
font-size:13.5px;color:#8E211C}
.pesan-galat{color:var(--merah);font-size:13px;margin:7px 0 0;font-weight:500}

.segmen{display:flex;background:var(--garis);border-radius:var(--r-s);padding:3px;gap:3px}
.segmen button{flex:1;padding:9px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--teks-2)}
.segmen button.aktif{background:var(--kartu);color:var(--teks);box-shadow:var(--bayang)}

.daftar{border:1px solid var(--garis);border-radius:var(--r);overflow:hidden;
background:var(--kartu);box-shadow:var(--bayang)}
.item{display:flex;align-items:center;gap:12px;padding:14px 16px;
border-bottom:1px solid var(--garis);width:100%;text-align:left}
.item:last-child{border-bottom:none}

.presentasi{position:fixed;inset:0;background:var(--navy);color:#fff;z-index:100;
display:flex;flex-direction:column;padding:6vh 7vw}
.presentasi h1{font-size:clamp(32px,5.6vw,64px);color:#fff;margin-bottom:.55em;letter-spacing:-.035em}
.presentasi li{font-size:clamp(19px,2.7vw,32px);line-height:1.5;
color:rgba(255,255,255,.88);margin-bottom:.6em}
.presentasi ul{padding-left:1.1em;margin:0}
.presentasi .kaki{margin-top:auto;display:flex;align-items:center;gap:14px;
color:rgba(255,255,255,.5);font-family:var(--f-mono);font-size:13px}
.presentasi .kaki button{color:#fff;border:1.5px solid rgba(255,255,255,.25);
border-radius:11px;width:46px;height:46px;font-size:19px}

.pita{position:fixed;top:0;left:0;right:0;z-index:60;padding:9px 16px;
font-size:12.5px;text-align:center;color:#fff;background:var(--api);font-weight:600}
.pita.kirim{background:var(--laut)}
.muat{display:flex;flex-direction:column;align-items:center;gap:13px;
padding:64px 20px;color:var(--teks-2)}
.putar{width:28px;height:28px;border:2.5px solid var(--garis);
border-top-color:var(--api);border-radius:99px;animation:putar .75s linear infinite}
@keyframes putar{to{transform:rotate(360deg)}}
video,iframe{display:block;border:0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(min-width:900px){.app{max-width:940px}.tab{max-width:940px}}
</style>
</head>
<body>
<div id="pita"></div>
<div id="akar" class="app"></div>
<div id="tabbar"></div>
<div id="lapis"></div>
<script>
/* =====================================================================
   TEKOR — Teknologi Keolahragaan
   Belajar mandiri, tidak terikat jam kuliah.

   YANG HARUS DIISI: dua baris di bawah ini.
   ===================================================================== */

var KONFIG = {
  ALAMAT_SERVER: 'https://script.google.com/macros/s/AKfycbw2hk7BMWx8_Wly6MP4z4aOY4257oW2KSP4Ns5VTo22CEJWTaOYfK0YabaoMFhwOZZaVQ/exec',
  KUNCI: 'tekor@2026'
};

/* Warna dan lambang tiap materi. Isinya sendiri diambil dari Sheets. */
var RUPA = {
 1:{w:'#6D5BD0',i:'\u25C8'},  2:{w:'#2C6FD1',i:'\u25A4'},  3:{w:'#0F8B8D',i:'\u25CE'},
 4:{w:'#5A6B7D',i:'\u25C7'},  5:{w:'#1F9254',i:'\u2632'},  6:{w:'#0F8B8D',i:'\u25CB'},
 7:{w:'#2C6FD1',i:'\u25A6'},  8:{w:'#B47500',i:'\u25A3'},  9:{w:'#6D5BD0',i:'\u25C9'},
 10:{w:'#6D5BD0',i:'\u25A3'}, 11:{w:'#8A6FD8',i:'\u25A1'}, 12:{w:'#FF6B2C',i:'\u25C8'},
 13:{w:'#0B6E5F',i:'\u270E'}, 14:{w:'#0B6E5F',i:'\u2699'}, 15:{w:'#0B6E5F',i:'\u2696'},
 16:{w:'#B47500',i:'\u25C6'}
};
function rupa(n){return RUPA[n]||RUPA[1]}

var SKALA = [
 [1,'Belum paham'],[2,'Masih bingung'],[3,'Cukup'],[4,'Paham'],[5,'Sangat paham']
];

/* Penyimpanan lokal, dibungkus agar tetap jalan bila peramban menolak. */
var Simpan=(function(){
  var bayangan={},bisa=false;
  try{localStorage.setItem('_c','1');localStorage.removeItem('_c');bisa=true}catch(e){}
  return{
    ambil:function(k){try{return bisa?localStorage.getItem(k):(bayangan[k]||null)}catch(e){return bayangan[k]||null}},
    taruh:function(k,v){try{bisa?localStorage.setItem(k,v):(bayangan[k]=v)}catch(e){bayangan[k]=v}},
    hapus:function(k){try{bisa?localStorage.removeItem(k):delete bayangan[k]}catch(e){delete bayangan[k]}}
  };
})();

var TERSAMBUNG = KONFIG.ALAMAT_SERVER.indexOf('http') === 0;

function server(aksi,data,pilih){
  pilih=pilih||{};
  if(!TERSAMBUNG) return Promise.resolve({ok:false,pesan:'Aplikasi belum tersambung ke server.'});
  var isi=Object.assign({aksi:aksi,kunci:KONFIG.KUNCI},data||{});
  return fetch(KONFIG.ALAMAT_SERVER,{
    method:'POST',redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(isi)
  }).then(function(r){return r.json()})
    .catch(function(){
      if(pilih.antre){antrekan(isi);return {ok:true,pesan:'Tersimpan di HP, dikirim saat ada sinyal.',tertunda:true}}
      return {ok:false,pesan:'Tidak dapat terhubung. Periksa sambungan internet.'};
    });
}

function antrekan(isi){
  var q=JSON.parse(Simpan.ambil('antrean')||'[]');
  q.push(isi); Simpan.taruh('antrean',JSON.stringify(q));
  pita('Tersimpan di HP. Menunggu sinyal.','');
}
function kirimAntrean(){
  var q=JSON.parse(Simpan.ambil('antrean')||'[]');
  if(!q.length||!TERSAMBUNG)return;
  pita('Mengirim '+q.length+' data tertunda','kirim');
  var sisa=[];
  q.reduce(function(rantai,item){
    return rantai.then(function(){
      return fetch(KONFIG.ALAMAT_SERVER,{method:'POST',redirect:'follow',
        headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(item)})
        .then(function(r){return r.json()}).catch(function(){sisa.push(item)});
    });
  },Promise.resolve()).then(function(){
    Simpan.taruh('antrean',JSON.stringify(sisa));
    pita(sisa.length?(sisa.length+' data masih tertunda'):'Semua data terkirim',sisa.length?'':'kirim');
    setTimeout(function(){pita('')},2600);
    if(!sisa.length) segarkanProfil();
  });
}
window.addEventListener('online',kirimAntrean);

function pita(teks,jenis){
  var p=document.getElementById('pita');
  if(!teks){p.innerHTML='';document.body.style.paddingTop='';return}
  p.innerHTML='<div class="pita '+(jenis||'')+'">'+teks+'</div>';
  document.body.style.paddingTop='36px';
}

/* Keadaan aplikasi */
var S={masuk:false,peran:'mhs',nim:'',nama:'',kelas:'',namaKelas:'',
 batas:1,berurutan:true,wajibJurnal:true,progres:{},kelompok:null,konten:null,
 layar:'gerbang',materi:1,tab:'materi',nilai:null,
 tiket:null,dosen:null,ringkasan:null,antri:null,kelasPilih:'A',jurnal:null,
 mulaiBelajar:null};

var AKAR=document.getElementById('akar'),TABBAR=document.getElementById('tabbar'),LAPIS=document.getElementById('lapis');
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function M(n){var k=(S.konten&&S.konten.materi)||[];for(var i=0;i<k.length;i++)if(k[i].n===Number(n))return k[i];return null}
function pg(n){return S.progres[n]||{}}
/* Materi dianggap belum siap bila dosen belum mengisi satu pun bagiannya. */
function adaIsi(m){
  if(!m)return false;
  return !!(m.poin.length || (m.ppt&&m.ppt.id) || m.video || m.tugas || m.soal.length);
}
/* Komponen yang wajib diselesaikan pada satu materi.
   Komponen yang tidak disiapkan dosen tidak ikut diwajibkan. */
function wajibMateri(n){
  var m=M(n);
  if(!m)return null;
  return {poin:m.poin.length>0, kegiatan:true, refleksi:!!m.video,
          tugas:!!(m.tugas||(m.soal&&m.soal.length)), jurnal:S.wajibJurnal};
}
function tuntas(n){
  var w=wajibMateri(n),p=pg(n);
  if(!w)return false;
  for(var k in w) if(w[k]&&!p[k]) return false;
  return true;
}

/* Empat keadaan, masing-masing dengan sebab yang berbeda:
     selesai   sudah dituntaskan
     jalan     boleh dikerjakan sekarang
     prasyarat materi sebelumnya belum tuntas
     batas     dosen belum membuka sampai nomor ini
     kosong    dosen belum mengunggah bahannya          */
function keadaan(n){
  if(tuntas(n))return 'selesai';
  /* Urutan pemeriksaan mengikuti tembok yang lebih dulu ditemui mahasiswa:
     batas dosen, lalu prasyarat, baru kesiapan bahan. Materi di luar batas
     disebut menunggu dibuka, bukan belum tersedia, karena itu keputusan dosen. */
  if(n>S.batas)return 'batas';
  if(S.berurutan&&n>1&&!tuntas(n-1))return 'prasyarat';
  if(!adaIsi(M(n)))return 'kosong';
  return 'jalan';
}
function ketKeadaan(n,k){
  if(k==='selesai')return 'Selesai';
  if(k==='kosong')return 'Belum tersedia';
  if(k==='batas')return 'Menunggu dibuka dosen';
  if(k==='prasyarat')return 'Selesaikan materi '+(n-1)+' dulu';
  return 'Siap dipelajari';
}
function ke(l,n){if(n)S.materi=n;S.layar=l;window.scrollTo(0,0);gambar()}
function tandaiLokal(n,k){if(!S.progres[n])S.progres[n]={};S.progres[n][k]=true;simpanSesi()}

/* =====================================================================
   PENGGAMBAR UTAMA
   ===================================================================== */
function gambar(){
  if(S.peran==='dosen'){gambarDosen();return}
  if(!S.masuk){AKAR.innerHTML=vGerbang();TABBAR.innerHTML='';ikat();return}
  if(!S.konten){AKAR.innerHTML=vMuat('Mengambil materi kuliah');TABBAR.innerHTML='';return}
  var v;
  switch(S.layar){
    case 'materi':   v=vDaftarMateri(); break;
    case 'ruang':    v=vRuang(); break;
    case 'poin':     v=vPoin(); break;
    case 'kegiatan': v=vKegiatan(); break;
    case 'refleksi': v=vRefleksi(); break;

/* ---------- mode presentasi ---------- */
var MP={n:1,i:0};
function bukaPresentasi(n){MP.n=n||1;MP.i=0;gambarPresentasi();document.addEventListener('keydown',tombolPres)}
function tombolPres(e){
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();geserPres(1)}
  else if(e.key==='ArrowLeft'){e.preventDefault();geserPres(-1)}
  else if(e.key==='Escape')tutupPres();
}
function tutupPres(){LAPIS.innerHTML='';document.removeEventListener('keydown',tombolPres)}
function geserPres(d){
  var m=M(MP.n); if(!m)return;
  MP.i+=d;
  if(MP.i<0){if(MP.n>1){MP.n--;var q=M(MP.n);MP.i=Math.max(0,(q?q.poin.length:1)-1)}else MP.i=0}
  if(MP.i>=m.poin.length){if(MP.n<16){MP.n++;MP.i=0}else MP.i=Math.max(0,m.poin.length-1)}
  gambarPresentasi();
}
function gambarPresentasi(){
  var m=M(MP.n); if(!m)return;
  var r=rupa(MP.n),b=m.poin[MP.i];
  var kaki='<div class="kaki"><button id="p-mundur">\u2190</button><button id="p-maju">\u2192</button>'
   +'<span class="isi">'+(b?(MP.i+1)+' / '+m.poin.length:'poin belum diisi')+'</span>'
   +(m.ppt&&m.ppt.id?'<button id="p-ppt" style="width:auto;padding:0 18px;font-family:var(--f-teks);font-size:14px">Buka slide</button>':'')
   +'<button id="p-tutup" style="width:auto;padding:0 18px;font-family:var(--f-teks);font-size:14px">Tutup</button></div>';
  LAPIS.innerHTML='<div class="presentasi">'
   +'<div style="font-family:var(--f-mono);font-size:13px;letter-spacing:.12em;color:'+r.w+';margin-bottom:20px">'
   +'MATERI '+MP.n+' &middot; '+esc(m.judul.toUpperCase())+'</div>'
   +(b?('<h1>'+esc(b.h)+'</h1><ul>'+b.b.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>')
      :('<h1>'+esc(m.judul)+'</h1>'))
   +kaki+'</div>';
  document.getElementById('p-mundur').onclick=function(){geserPres(-1)};
  document.getElementById('p-maju').onclick=function(){geserPres(1)};
  document.getElementById('p-tutup').onclick=tutupPres;
  var pp=document.getElementById('p-ppt');
  if(pp)pp.onclick=function(){
    window.open(m.ppt.jenis==='slides'
      ? 'https://docs.google.com/presentation/d/'+m.ppt.id+'/present'
      : 'https://drive.google.com/file/d/'+m.ppt.id+'/view','_blank');
  };
}

/* =====================================================================
   PENGIKAT TOMBOL
   ===================================================================== */
function pada(sel,ev,fn){var e=document.querySelectorAll(sel);for(var i=0;i<e.length;i++)e[i].addEventListener(ev,fn)}
function el(id){return document.getElementById(id)}
function sibuk(b,t){if(!b)return function(){};var a=b.textContent;b.disabled=true;b.textContent=t;
  return function(){b.disabled=false;b.textContent=a}}
function galat(id,pesan){var e=el(id);if(!e)return;e.textContent=pesan;e.classList.remove('sembunyi')}

function ikat(){
  pada('[data-tab]','click',function(){
    S.tab=this.dataset.tab;S.layar=this.dataset.tab;
    if(S.tab==='nilai')ambilNilai();
    gambar();
  });
  pada('[data-materi]','click',function(){ke('ruang',+this.dataset.materi)});
  pada('[data-balik]','click',function(){ke(this.dataset.balik)});
  pada('[data-buka]','click',function(){
    var k=this.dataset.buka;
    if(k==='jurnal')S.mulaiBelajar=S.mulaiBelajar||Date.now();
    ke(k);
  });

  var bm=el('b-masuk'); if(bm)bm.onclick=lakukanMasuk;
  var gd=el('b-gerbang-dosen'); if(gd)gd.onclick=function(){S.peran='dosen';S.layar='dPintu';gambar()};
  var bd=el('b-balik-mhs'); if(bd)bd.onclick=function(){
    S.peran='mhs';
    if(S.nim){S.masuk=true;S.layar='materi';S.tab='materi';gambar();if(!S.konten)ambilKonten()}
    else{S.masuk=false;S.layar='gerbang';gambar()}
  };
  var kl=el('b-keluar'); if(kl)kl.onclick=function(){
    Simpan.hapus('sesi');S.masuk=false;S.konten=null;S.nim='';S.layar='gerbang';gambar()};
  var sg=el('b-segarkan'); if(sg)sg.onclick=function(){
    var lepas=sibuk(sg,'Memuat...');ambilKonten(true).then(function(){lepas();alert('Materi diperbarui.')})};

  var pp=el('b-ppt-penuh'); if(pp)pp.onclick=function(){
    var f=el('bingkai-ppt'); if(!f)return;
    var minta=f.requestFullscreen||f.webkitRequestFullscreen||f.webkitEnterFullscreen;
    if(minta)minta.call(f);
  };

  var bp=el('b-poin'); if(bp)bp.onclick=function(){
    var lepas=sibuk(bp,'Menyimpan...');
    S.mulaiBelajar=S.mulaiBelajar||Date.now();
    server('selesaiPoin',{nim:S.nim,materi:S.materi},{antre:true}).then(function(r){
      lepas(); if(r.ok){tandaiLokal(S.materi,'poin');ke('ruang')} else alert(r.pesan);
    });
  };

  ikatRefleksi(); ikatTugas(); ikatJurnal(); ikatKegiatan(); ikatDosen();
}

function ikatRefleksi(){
  var b=el('b-refleksi'); if(!b)return;
  var t=el('ref-isi');
  t.oninput=function(){el('ref-hitung').textContent=t.value.trim().length+' karakter';
    el('ref-galat').classList.add('sembunyi')};
  b.onclick=function(){
    if(t.value.trim().length<40) return galat('ref-galat','Refleksi masih terlalu pendek, minimal 40 karakter.');
    var lepas=sibuk(b,'Mengirim...');
    server('kirimRefleksi',{nim:S.nim,materi:S.materi,jawaban:t.value.trim()},{antre:true}).then(function(r){
      lepas(); if(r.ok){tandaiLokal(S.materi,'refleksi');ke('ruang')} else galat('ref-galat',r.pesan);
    });
  };
}

function ikatTugas(){
  var b=el('b-tugas'); if(!b)return;
  var berkas=null;
  el('b-pilih-berkas').onclick=function(){el('tg-berkas').click()};
  el('tg-berkas').onchange=function(){
    var f=this.files[0]; if(!f)return;
    if(f.size>8*1024*1024) return galat('tg-galat','Berkas terlalu besar. Maksimal 8 MB.');
    var fr=new FileReader();
    fr.onload=function(){
      berkas={isi:fr.result,nama:f.name,tipe:f.type||'application/octet-stream'};
      var n=el('tg-nama'); n.innerHTML='<span class="lencana">'+esc(f.name)+'</span>';
      n.classList.remove('sembunyi'); el('tg-galat').classList.add('sembunyi');
    };
    fr.readAsDataURL(f);
  };
  b.onclick=function(){
    var teks=el('tg-isi').value.trim();
    if(teks.length<20&&!berkas) return galat('tg-galat','Isi jawaban atau lampirkan berkas terlebih dahulu.');
    var lepas=sibuk(b,'Mengirim...');
    var kirim={nim:S.nim,materi:S.materi,jawaban:teks};
    if(berkas){kirim.berkas=berkas.isi;kirim.namaBerkas=berkas.nama;kirim.tipeBerkas=berkas.tipe}
    server('kirimTugas',kirim,{antre:!berkas}).then(function(r){
      lepas(); if(r.ok){tandaiLokal(S.materi,'tugas');ke('ruang')} else galat('tg-galat',r.pesan);
    });
  };
}

function ikatJurnal(){
  var b=el('b-jurnal'); if(!b)return;
  var pilihan={poin:false,ppt:false,video:false},paham=0;
  pada('[data-centang]','click',function(){
    var k=this.dataset.centang;
    pilihan[k]=!pilihan[k];
    this.classList.toggle('pilih',pilihan[k]);
  });
  pada('[data-paham]','click',function(){
    paham=+this.dataset.paham;
    var s=document.querySelectorAll('[data-paham]');
    for(var i=0;i<s.length;i++) s[i].classList.toggle('pilih',s[i]===this);
    el('jr-galat').classList.add('sembunyi');
  });
  b.onclick=function(){
    if(!paham) return galat('jr-galat','Pilih dulu seberapa paham Anda dengan materi ini.');
    var lepas=sibuk(b,'Menyimpan...');
    var durasi=S.mulaiBelajar?Math.max(1,Math.round((Date.now()-S.mulaiBelajar)/60000)):'';
    server('kirimJurnal',{nim:S.nim,materi:S.materi,poin:pilihan.poin,ppt:pilihan.ppt,
      video:pilihan.video,paham:paham,tanya:el('jr-tanya').value.trim(),durasi:durasi},{antre:true})
    .then(function(r){
      lepas();
      if(!r.ok) return galat('jr-galat',r.pesan);
      tandaiLokal(S.materi,'jurnal'); S.mulaiBelajar=null;
      if(r.perluBantuan) alert('Catatan Anda tersimpan. Dosen akan melihat bahwa materi ini masih membingungkan.');
      ke('ruang');
    });
  };
}

function ikatKegiatan(){
  if(el('gps-kanvas')) mesinGps();
  if(el('pose-kanvas')) mesinPose();
  if(el('dash-kanvas')) mesinDash();
  if(el('ujian-kotak')) mesinUjian();

  var bk=el('b-kegiatan');
  if(bk)bk.onclick=function(){selesaiKegiatan(null,bk)};

  var bs=el('b-kasus');
  if(bs)bs.onclick=function(){
    var isian=document.querySelectorAll('.kasus-isi'),jawaban=[],lengkap=true;
    for(var i=0;i<isian.length;i++){
      if(isian[i].value.trim().length<25) lengkap=false;
      jawaban.push({tanya:isian[i].dataset.tanya,isi:isian[i].value.trim()});
    }
    if(!lengkap) return galat('ks-galat','Kedua pertanyaan perlu dijawab, minimal 25 karakter.');
    selesaiKegiatan({jenis:'Studi kasus',jawaban:jawaban},bs);
  };

  var bpr=el('b-proyek');
  if(bpr)bpr.onclick=function(){
    var t=el('proyek-isi').value.trim();
    if(t.length<25) return galat('proyek-galat','Catatan terlalu pendek, minimal 25 karakter.');
    selesaiKegiatan({jenis:'Catatan kelompok',jawaban:[{tanya:'Catatan kemajuan',isi:t}]},bpr);
  };
}

function selesaiKegiatan(muatan,tombol){
  var lepas=sibuk(tombol,'Menyimpan...');
  return server('kirimKegiatan',Object.assign({nim:S.nim,materi:S.materi},muatan||{}),{antre:true})
    .then(function(r){
      lepas();
      if(r.ok){tandaiLokal(S.materi,'kegiatan');ke('ruang')} else alert(r.pesan);
      return r;
    });
}

/* =====================================================================
   MESIN KEGIATAN
   ===================================================================== */
function ukur(kanvas,tinggi){
  var lebar=kanvas.getBoundingClientRect().width||320;
  kanvas.width=lebar*2; kanvas.height=tinggi*2;
  var kt=kanvas.getContext('2d'); kt.scale(2,2);
  return {kt:kt,W:lebar,H:tinggi};
}

function mesinGps(){
  var k=el('gps-kanvas'),u=ukur(k,210),kt=u.kt,W=u.W,H=u.H;
  var titik=[],pantau=null,mulai=0,puncak=0;
  function jarakMeter(a,b){
    var R=6371000,d1=a.lat*Math.PI/180,d2=b.lat*Math.PI/180;
    var dd=(b.lat-a.lat)*Math.PI/180,dl=(b.lng-a.lng)*Math.PI/180;
    var x=Math.sin(dd/2)*Math.sin(dd/2)+Math.cos(d1)*Math.cos(d2)*Math.sin(dl/2)*Math.sin(dl/2);
    return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
  }
  function total(){var s=0;for(var i=1;i<titik.length;i++)s+=jarakMeter(titik[i-1],titik[i]);return s}
  function lukis(){
    kt.clearRect(0,0,W,H);
    kt.strokeStyle='rgba(255,255,255,.12)';kt.lineWidth=1;kt.strokeRect(10,10,W-20,H-20);
    if(titik.length<2){
      kt.fillStyle='rgba(255,255,255,.45)';kt.font='500 12px sans-serif';kt.textAlign='center';
      kt.fillText(titik.length?'Menunggu titik berikutnya':'Belum ada titik terekam',W/2,H/2);
      return;
    }
    var la=titik.map(function(p){return p.lat}),lo=titik.map(function(p){return p.lng});
    var minLa=Math.min.apply(null,la),maxLa=Math.max.apply(null,la);
    var minLo=Math.min.apply(null,lo),maxLo=Math.max.apply(null,lo);
    var sk=Math.min((W-40)/Math.max(1e-5,maxLo-minLo),(H-40)/Math.max(1e-5,maxLa-minLa));
    var pos=function(p){return [W/2+(p.lng-(minLo+maxLo)/2)*sk,H/2-(p.lat-(minLa+maxLa)/2)*sk]};
    kt.lineWidth=2.8;kt.lineCap='round';
    for(var i=1;i<titik.length;i++){
      var a=pos(titik[i-1]),b=pos(titik[i]),kec=titik[i].kec||0;
      kt.strokeStyle=kec>13?'#FF6B2C':kec>7?'#E5A100':'#35C26B';
      kt.beginPath();kt.moveTo(a[0],a[1]);kt.lineTo(b[0],b[1]);kt.stroke();
    }
    var akhir=pos(titik[titik.length-1]);
    kt.fillStyle='#fff';kt.beginPath();kt.arc(akhir[0],akhir[1],5,0,7);kt.fill();
  }
  lukis();
  el('g-mulai').onclick=function(){
    if(!navigator.geolocation){el('g-pesan').className='galat';
      el('g-pesan').textContent='Perangkat ini tidak mendukung GPS.';return}
    titik=[];puncak=0;mulai=Date.now();
    this.classList.add('sembunyi'); el('g-henti').classList.remove('sembunyi');
    el('g-pesan').className='catatan';
    el('g-pesan').textContent='Sedang merekam. Biarkan aplikasi tetap terbuka sambil bergerak.';
    pantau=navigator.geolocation.watchPosition(function(p){
      var baru={lat:p.coords.latitude,lng:p.coords.longitude,t:Date.now(),kec:(p.coords.speed||0)*3.6};
      if(titik.length){
        var d=jarakMeter(titik[titik.length-1],baru);
        if(d<1)return;
        if(!p.coords.speed){var dt=(baru.t-titik[titik.length-1].t)/1000;baru.kec=dt>0?(d/dt*3.6):0}
      }
      if(baru.kec>puncak&&baru.kec<45)puncak=baru.kec;
      titik.push(baru);lukis();
      var jarak=total(),detik=(Date.now()-mulai)/1000;
      el('g-jarak').textContent=Math.round(jarak);
      el('g-rata').textContent=detik>0?(jarak/detik*3.6).toFixed(1):'0.0';
      el('g-puncak').textContent=puncak.toFixed(1);
      el('g-titik').textContent=titik.length;
    },function(e){
      el('g-pesan').className='galat';
      el('g-pesan').textContent='GPS tidak dapat diakses ('+e.message+'). Pastikan izin lokasi diberikan.';
    },{enableHighAccuracy:true,maximumAge:1000,timeout:15000});
  };
  el('g-henti').onclick=function(){
    if(pantau!==null){navigator.geolocation.clearWatch(pantau);pantau=null}
    this.classList.add('sembunyi'); el('g-mulai').classList.remove('sembunyi');
    el('g-mulai').textContent='Rekam ulang';
    var jarak=Math.round(total()),detik=(Date.now()-mulai)/1000;
    if(titik.length<5){el('g-pesan').className='galat';
      el('g-pesan').textContent='Titik terlalu sedikit. Rekam minimal 2 menit sambil bergerak.';return}
    var zona={jalan:0,sedang:0,sprint:0};
    titik.forEach(function(p){var v=p.kec||0;if(v>13)zona.sprint++;else if(v>7)zona.sedang++;else zona.jalan++});
    var n=titik.length||1,rata=(jarak/detik*3.6);
    var lepas=sibuk(this,'Menyimpan...');
    server('kirimKegiatan',{nim:S.nim,materi:S.materi,jenis:'Rekaman GPS',
      jawaban:[{tanya:'Hasil rekaman GPS',
        isi:jarak+' meter dalam '+Math.round(detik/60)+' menit, rata-rata '+rata.toFixed(1)
            +' km/jam, puncak '+puncak.toFixed(1)+' km/jam, '+titik.length+' titik'}]},{antre:true})
    .then(function(){
      lepas(); tandaiLokal(S.materi,'kegiatan');
      var kotak=el('g-hasil'); kotak.className='';
      kotak.innerHTML='<div class="kartu"><div class="label" style="margin-bottom:12px">Zona kecepatan</div>'
       +[['Jalan atau pemulihan',Math.round(zona.jalan/n*100),'#35C26B'],
         ['Lari sedang',Math.round(zona.sedang/n*100),'#E5A100'],
         ['Sprint',Math.round(zona.sprint/n*100),'#FF6B2C']].map(function(z){
        return '<div style="margin-bottom:11px"><div class="baris" style="font-size:13px;margin-bottom:5px">'
        +'<span class="isi">'+z[0]+'</span><span class="mono" style="font-weight:600">'+z[1]+'%</span></div>'
        +'<div class="bilah"><i style="width:'+z[1]+'%;background:'+z[2]+'"></i></div></div>'}).join('')
       +'<p class="redup" style="margin:12px 0 0;font-size:13px">Total '+jarak+' meter. '
       +'Jarak saja tidak cukup; porsi sprint inilah yang paling menentukan kelelahan.</p>'
       +'<button class="tbl utama penuh" id="b-gps-lanjut" style="margin-top:14px">Kembali ke materi</button></div>';
      el('b-gps-lanjut').onclick=function(){ke('ruang')};
    });
  };
}

function mesinPose(){
  var k=el('pose-kanvas'),u=ukur(k,224),kt=u.kt,W=u.W,H=u.H;
  function lukis(f){
    var t=Math.sin(f*Math.PI);
    var lutut=175-t*98,pinggul=172-t*82,badan=4+t*26;
    var cx=W/2,cy=H*0.26+t*44,py=cy+56,ly=py+44-t*8,ky=ly+48,miring=t*16;
    kt.clearRect(0,0,W,H);
    kt.strokeStyle='rgba(255,255,255,.12)';kt.lineWidth=1;
    kt.beginPath();kt.moveTo(18,H-18);kt.lineTo(W-18,H-18);kt.stroke();
    kt.strokeStyle='#3BE0C0';kt.lineWidth=2.8;kt.lineCap='round';kt.lineJoin='round';
    kt.beginPath();
    kt.moveTo(cx+miring,cy);kt.lineTo(cx,py);
    kt.lineTo(cx-14-t*10,ly);kt.lineTo(cx-4,ky);
    kt.moveTo(cx,py);kt.lineTo(cx+16+t*8,ly);kt.lineTo(cx+8,ky);
    kt.moveTo(cx+miring,cy+14);kt.lineTo(cx+30+t*14,cy+42);
    kt.moveTo(cx+miring,cy+14);kt.lineTo(cx-28-t*10,cy+38);
    kt.stroke();
    kt.fillStyle='#fff';kt.beginPath();kt.arc(cx+miring,cy-12,11,0,7);kt.fill();
    [[cx+miring,cy],[cx,py],[cx-14-t*10,ly],[cx+16+t*8,ly],[cx-4,ky],[cx+8,ky]].forEach(function(j){
      kt.fillStyle='#FF6B2C';kt.beginPath();kt.arc(j[0],j[1],3.8,0,7);kt.fill()});
    kt.fillStyle='rgba(255,255,255,.85)';kt.font='600 12px monospace';kt.textAlign='right';
    kt.fillText(Math.round(lutut)+'\u00B0',cx-30-t*10,ly+4);
    el('a-lutut').innerHTML=Math.round(lutut)+'\u00B0';
    el('a-pinggul').innerHTML=Math.round(pinggul)+'\u00B0';
    el('a-badan').innerHTML=Math.round(badan)+'\u00B0';
    el('pose-nilai').textContent=Math.round(f*100)+'%';
  }
  lukis(0);
  el('pose-geser').oninput=function(){lukis(this.value/100)};
}

function mesinDash(){
  var k=el('dash-kanvas'),u=ukur(k,200),kt=u.kt,W=u.W,H=u.H,m=0;
  var judul=['Jarak tempuh (meter)','Detak rata-rata (BPM)','Jumlah sprint'];
  var catatan=['Dedi menempuh jarak terjauh, tetapi jarak saja belum bercerita soal beban.',
   'Detak rata-rata Cakra paling tinggi. Perlu diperiksa apakah pemulihannya cukup.',
   'Dedi dan Bima paling banyak sprint. Merekalah yang paling perlu dirotasi.'];
  function lukis(){
    kt.clearRect(0,0,W,H);
    var nilai=DATA_ATLET.map(function(a){return a[m+1]});
    var maks=Math.max.apply(null,nilai)*1.16;
    var bw=(W-20)/DATA_ATLET.length;
    DATA_ATLET.forEach(function(a,i){
      var v=a[m+1],tg=(v/maks)*(H-54),px=12+i*bw,py=H-30-tg;
      kt.fillStyle=(v===Math.max.apply(null,nilai))?'#0B1F3A':'#CBD3DC';
      kt.beginPath();
      if(kt.roundRect)kt.roundRect(px,py,bw-12,tg,7);else kt.rect(px,py,bw-12,tg);
      kt.fill();
      kt.fillStyle='#5A6B7D';kt.font='500 11px sans-serif';kt.textAlign='center';
      kt.fillText(a[0],px+(bw-12)/2,H-11);
      kt.fillStyle='#0B1F3A';kt.font='600 11px monospace';
      kt.fillText(v,px+(bw-12)/2,py-7);
    });
    kt.fillStyle='#93A1B0';kt.font='500 11px sans-serif';kt.textAlign='left';
    kt.fillText(judul[m],2,12);
    el('dash-catatan').textContent=catatan[m];
  }
  lukis();
  pada('[data-metrik]','click',function(){
    m=+this.dataset.metrik;
    var b=document.querySelectorAll('[data-metrik]');
    for(var i=0;i<b.length;i++)b[i].classList.toggle('aktif',b[i]===this);
    lukis();
  });
}

function mesinUjian(){
  var m=M(S.materi); if(!m||!m.soal.length)return;
  var i=0,jawaban={},huruf=['A','B','C','D'];
  function tampil(){
    var kotak=el('ujian-kotak');
    if(i>=m.soal.length){
      kotak.innerHTML=vMuat('Memeriksa jawaban');
      server('kirimUjian',{nim:S.nim,materi:S.materi,jawaban:jawaban}).then(function(r){
        kotak.innerHTML='';
        var h=el('ujian-hasil'); h.className='';
        if(!r.ok){h.innerHTML='<div class="galat">'+esc(r.pesan)+'</div>';return}
        tandaiLokal(S.materi,'kegiatan'); tandaiLokal(S.materi,'tugas');
        h.innerHTML='<div class="kartu"><div class="label">Hasil</div>'
         +'<div class="angka" style="margin:8px 0">'+r.nilai+'</div>'
         +'<p class="redup" style="margin:0">'+r.benar+' dari '+r.total+' soal benar. Nilai sudah tercatat.</p>'
         +'<button class="tbl utama penuh" id="b-ujian-tutup" style="margin-top:14px">Kembali ke materi</button></div>';
        el('b-ujian-tutup').onclick=function(){ke('ruang')};
      });
      return;
    }
    var s=m.soal[i];
    kotak.innerHTML='<div class="kartu"><div class="label" style="margin-bottom:12px">Soal '+(i+1)+' dari '+m.soal.length+'</div>'
     +'<p style="margin:0 0 14px;font-size:15.5px;font-weight:600">'+esc(s.tanya)+'</p><div class="tumpuk">'
     +s.pilihan.map(function(o,x){
       return '<button class="tbl penuh" data-pilih="'+huruf[x]+'" style="justify-content:flex-start;text-align:left">'
       +'<b class="mono" style="margin-right:8px;color:var(--teks-3)">'+huruf[x]+'</b>'+esc(o)+'</button>'
     }).join('')+'</div></div>';
    pada('[data-pilih]','click',function(){jawaban[s.no]=this.dataset.pilih;i++;tampil()});
  }
  tampil();
}

function ikatDosen(){
  pada('[data-dtab]','click',function(){
    S.layar=this.dataset.dtab; gambarDosen();
    if(S.layar==='dPanel')ambilRingkasan();
    if(S.layar==='dJurnal')ambilJurnal();
    if(S.layar==='dKelas')ambilKelas();
  });
  pada('[data-dbalik]','click',function(){S.layar=this.dataset.dbalik;gambarDosen()});

  var dm=el('b-dosen-masuk');
  if(dm)dm.onclick=function(){
    var sandi=el('d-sandi').value;
    if(!sandi) return galat('d-galat','Isi kata sandi.');
    var lepas=sibuk(dm,'Memeriksa...');
    server('masukDosen',{sandi:sandi}).then(function(r){
      lepas();
      if(!r.ok) return galat('d-galat',r.pesan);
      S.tiket=r.tiket;S.dosen=r;S.peran='dosen';S.layar='dPanel';
      gambarDosen();ambilRingkasan();
      if(!S.konten){S.kelas=S.kelas||'A';ambilKontenDosen()}
    });
  };
  var kd=el('b-keluar-dosen');
  if(kd)kd.onclick=function(){S.tiket=null;S.peran='mhs';
    S.layar=S.nim?'materi':'gerbang';S.masuk=!!S.nim;gambar()};

  var bar=el('b-arsip');
  if(bar)bar.onclick=function(){
    var sandi=prompt('Ketik kata sandi dosen untuk membuat arsip:');
    if(!sandi)return;
    var lepas=sibuk(bar,'Menyalin...');
    server('cadangkan',{tiket:S.tiket,sandi:sandi}).then(function(r){
      lepas();
      alert(r.ok?(r.pesan+'\n\nArsip dapat dibuka dari Drive Anda.'):r.pesan);
    });
  };
  var bak=el('b-akhir');
  if(bak)bak.onclick=function(){S.layar='dAkhir';gambarDosen()};
  var bts=el('b-tutup-semester');
  if(bts)bts.onclick=function(){kirimTutupSemester(false)};

  var bpr=el('b-presentasi');
  if(bpr)bpr.onclick=function(){
    if(!S.konten){var lepas=sibuk(bpr,'Memuat...');ambilKontenDosen().then(function(){lepas();bukaPresentasi(1)})}
    else bukaPresentasi(1);
  };

  pada('[data-daksi]','click',function(){
    var a=this.dataset.daksi;
    if(a.indexOf('buka:')===0){
      var k=a.split(':')[1],tb=this,lepas=sibuk(tb,'...');
      server('bukaMateri',{tiket:S.tiket,kelas:k}).then(function(r){
        lepas();alert(r.pesan||'Selesai');if(r.ok)ambilRingkasan();
      });
    } else {
      S.layar=a; gambarDosen();
      if(a==='dNilai')ambilAntrian();
      if(a==='dJurnal')ambilJurnal();
    }
  });

  pada('[data-jkls]','click',function(){S.kelasPilih=this.dataset.jkls;S.jurnal=null;gambarDosen();ambilJurnal()});
  pada('[data-kkls]','click',function(){S.kelasPilih=this.dataset.kkls;gambarDosen();ambilKelas()});
  pada('[data-batas]','click',function(){
    var b=this.dataset.batas.split(':'),tb=this;
    var lepas=sibuk(tb,'...');
    server('bukaMateri',{tiket:S.tiket,kelas:b[0],materi:Number(b[1])}).then(function(r){
      lepas();
      if(!r.ok)return alert(r.pesan);
      ambilRingkasan();
    });
  });
  pada('[data-cepat]','click',function(){el('d-nilai').value=this.dataset.cepat});
  pada('[data-komen]','click',function(){
    var t=el('d-komentar'); t.value=(t.value?t.value+' ':'')+this.dataset.komen+'.';
  });
  var ds=el('d-simpan');
  if(ds)ds.onclick=function(){
    var t=S.antri[0],lepas=sibuk(ds,'Menyimpan...');
    server('simpanNilai',{tiket:S.tiket,nim:t.nim,materi:t.materi,
      nilai:Number(el('d-nilai').value),komentar:el('d-komentar').value}).then(function(r){
      lepas(); if(!r.ok)return alert(r.pesan);
      S.antri.shift(); gambarDosen();
    });
  };
  var dl=el('d-lewati');
  if(dl)dl.onclick=function(){S.antri.push(S.antri.shift());gambarDosen()};
}

function kirimTutupSemester(abaikan){
  var b=el('b-tutup-semester'),lepas=sibuk(b,'Memproses...');
  server('tutupSemester',{
    tiket:S.tiket, sandi:el('ak-sandi').value,
    tahunBaru:el('ak-tahun').value.trim(),
    konfirmasi:el('ak-konfirmasi').value,
    abaikanBelumDinilai:!!abaikan
  }).then(function(r){
    lepas();
    if(r.perluKonfirmasi){
      if(confirm(r.pesan+'\n\nLanjutkan menutup semester?')) kirimTutupSemester(true);
      return;
    }
    if(!r.ok) return galat('ak-galat',r.pesan);
    var kotak=el('ak-hasil'); kotak.className='';
    var rinci=Object.keys(r.dihapus||{}).map(function(k){
      return '<div class="baris" style="font-size:13px"><span class="isi">'+esc(k)+'</span>'
       +'<span class="mono">'+r.dihapus[k]+' baris</span></div>'}).join('');
    kotak.innerHTML='<div class="sukses" style="margin-bottom:12px">'+esc(r.pesan)+'</div>'
     +'<div class="kartu"><div class="label" style="margin-bottom:8px">Arsip tersimpan</div>'
     +'<p style="margin:0 0 8px;font-size:14px">'+esc(r.arsip)+'</p>'
     +(r.tautan?'<a class="tbl kecil" href="'+esc(r.tautan)+'" target="_blank" rel="noopener">Buka arsip</a>':'')
     +'<div class="label" style="margin:14px 0 8px">Yang dikosongkan</div>'+rinci+'</div>';
    b.disabled=true; S.ringkasan=null;
  });
}

/* =====================================================================
   PENGAMBILAN DATA
   ===================================================================== */
function ambilKonten(paksa){
  var simpanan=Simpan.ambil('konten_'+S.kelas);
  if(simpanan&&!paksa){try{S.konten=JSON.parse(simpanan)}catch(e){}}
  return server('konten',{nim:S.nim,kelas:S.kelas}).then(function(r){
    if(r.ok){S.konten=r.data;Simpan.taruh('konten_'+S.kelas,JSON.stringify(r.data))}
    else if(!S.konten)pita('Materi belum dapat dimuat. Periksa sambungan.','');
    gambar();
  });
}
function ambilKontenDosen(){
  return server('konten',{tiket:S.tiket,kelas:S.kelasPilih||'A'}).then(function(r){
    if(r.ok)S.konten=r.data;
  });
}
function ambilNilai(){
  server('nilaiSaya',{nim:S.nim}).then(function(r){if(r.ok){S.nilai=r.data;gambar()}});
}
function ambilRingkasan(){
  server('ringkasan',{tiket:S.tiket}).then(function(r){
    if(r.sesiHabis){S.tiket=null;S.layar='dPintu';gambarDosen();return}
    if(r.ok){S.ringkasan=r.data;gambarDosen()}
  });
}
function ambilAntrian(){
  S.antri=null;
  server('daftarPenilaian',{tiket:S.tiket}).then(function(r){S.antri=r.ok?r.data:[];gambarDosen()});
}
function ambilJurnal(){
  S.jurnal=null;
  server('daftarJurnal',{tiket:S.tiket,kelas:S.kelasPilih}).then(function(r){
    S.jurnal=r.ok?r:{data:[],rata:null,sebaran:[0,0,0,0,0],jumlah:0};
    gambarDosen();
  });
}
function ambilKelas(){
  server('daftarKelas',{tiket:S.tiket,kelas:S.kelasPilih}).then(function(r){
    var kotak=el('kotak-kelas'); if(!kotak)return;
    if(!r.ok||!r.data.length){kotak.innerHTML='<div class="catatan">Belum ada mahasiswa di kelas ini.</div>';return}
    kotak.innerHTML='<div class="daftar">'+r.data.map(function(m){
      var warna=m.tuntas===0?'var(--merah)':m.tuntas<3?'var(--kuning)':'var(--hijau)';
      return '<div class="item">'
      +'<span style="width:34px;height:34px;border-radius:11px;background:var(--kertas);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px">'+esc(m.nama.charAt(0))+'</span>'
      +'<span class="isi"><span style="display:block;font-size:14px;font-weight:600">'+esc(m.nama)+'</span>'
      +'<span class="redup mono" style="font-size:12px">'+esc(m.nim)+'</span></span>'
      +'<span class="lencana mono" style="color:'+warna+'">'+m.tuntas+'/16</span></div>';
    }).join('')+'</div>'
    +'<p class="redup" style="font-size:12.5px;margin-top:13px">Diurutkan dari yang paling sedikit menuntaskan materi.</p>';
  });
}

/* =====================================================================
   SESI
   ===================================================================== */
function simpanSesi(){
  Simpan.taruh('sesi',JSON.stringify({nim:S.nim,nama:S.nama,kelas:S.kelas,namaKelas:S.namaKelas,
    batas:S.batas,berurutan:S.berurutan,wajibJurnal:S.wajibJurnal,
    progres:S.progres,kelompok:S.kelompok}));
}
function pakaiData(d){
  S.nim=d.nim;S.nama=d.nama;S.kelas=d.kelas;S.namaKelas=d.namaKelas||'';
  S.batas=d.batas||1;S.berurutan=d.berurutan!==false;
  S.wajibJurnal=d.wajibJurnal!==false;
  S.kelompok=d.kelompok||null;S.progres=d.progres||{};
  S.masuk=true;S.peran='mhs';S.layar='materi';S.tab='materi';
  simpanSesi();
}
function lakukanMasuk(){
  var nim=el('i-nim').value.trim(),kode=el('i-kode').value.trim().toUpperCase();
  if(!nim) return galat('pesan-gerbang','Isi NIM Anda.');
  if(!kode) return galat('pesan-gerbang','Isi kode kelas dari dosen.');
  var b=el('b-masuk'),lepas=sibuk(b,'Menghubungi...');
  server('daftar',{nim:nim,kodeKelas:kode}).then(function(r){
    lepas();
    if(!r.ok) return galat('pesan-gerbang',r.pesan);
    pakaiData(r.data); gambar(); ambilKonten();
  });
}
function segarkanProfil(){
  if(!S.nim)return;
  server('masuk',{nim:S.nim}).then(function(r){if(r.ok){pakaiData(r.data);gambar()}});
}

function mulaiAplikasi(){
  var pintuDosen=/[?&]dosen\b/.test(location.search);
  var sesi=Simpan.ambil('sesi');
  if(sesi){
    try{
      var d=JSON.parse(sesi);
      S.nim=d.nim;S.nama=d.nama;S.kelas=d.kelas;S.namaKelas=d.namaKelas;
      S.batas=d.batas||1;S.berurutan=d.berurutan!==false;
      S.wajibJurnal=d.wajibJurnal!==false;
      S.progres=d.progres||{};S.kelompok=d.kelompok||null;
      S.masuk=true;S.layar='materi';
      var simpanan=Simpan.ambil('konten_'+S.kelas);
      if(simpanan)S.konten=JSON.parse(simpanan);
    }catch(e){}
  }
  if(pintuDosen){S.peran='dosen';S.layar='dPintu';gambarDosen()}
  else{
    gambar();
    if(S.masuk){ambilKonten();segarkanProfil()}
  }
  kirimAntrean();
  if('serviceWorker' in navigator){
    window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
  }
}
mulaiAplikasi();
